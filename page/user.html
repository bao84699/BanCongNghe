<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/citymap.css">
    <link rel="stylesheet" href="../css/filter-bar.css">
    <link rel="stylesheet" href="../css/intro-stats.css">
    <title>Thành Viên — BCN · IUH</title>
</head>
<body>
    <div id="header"></div>
    <script src="../component/header.js"></script>
    <main>
        <div id="introStatsContainer"></div>
        <section class="citymap-section">
            <div class="citymap-content"> 
            <section class="filter" style="margin-bottom: 24px;">
                <div class="filter-left">
                    <div class="item active cf-btn" data-role="all">Tất cả</div>
                    <div class="item cf-btn" data-role="Leader">Leader</div>
                    <div class="item cf-btn" data-role="Designer">Designer</div>
                    <div class="item cf-btn" data-role="Dev">Dev</div>
                    <div style="width: 1px; background: var(--border2); margin: 0 5px;"></div>
                    <div class="item cf-btn" data-rank="1" style="color: #c09030; font-weight: 600;">Gold</div>
                    <div class="item cf-btn" data-rank="2" style="color: #6a8898; font-weight: 600;">Silver</div>
                    <div class="item active cf-btn" data-rank="all">Tất cả Rank</div>
                </div>
                <div class="filter-right">
                    <select id="cf-sort-select">
                        <option value="level">Level cao nhất</option>
                        <option value="projects">Dự án nhiều nhất</option>
                        <option value="exp">EXP cao nhất</option>
                    </select>
                    <div class="search">
                        <input type="text" id="cf-search-input" class="search-inp" placeholder="Tìm kiếm thành viên...">
                        <label for="cf-search-input">
                            <i data-lucide="search"></i>
                        </label>
                    </div>
                    <div class="item" id="cf-reset-btn">RESET</div>
                </div>
            </section>
            <div class="citymap-wrap">
                    <div class="citymap-grid" id="citymap-grid"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <script src="../component/introStats.js"></script>
    <script src="../js/user.js"></script>
    <script src="../component/footer.js"></script>
    <script src="../component/citymap.js"></script>
</body>
</html>
